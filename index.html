<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>berryliciousclothing v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .mode-outward { --primary: #f97316; --primary-hover: #ea580c; --bg-accent: #fff7ed; }
        .mode-inward { --primary: #3b82f6; --primary-hover: #2563eb; --bg-accent: #eff6ff; }
        
        .theme-bg { background-color: var(--primary); }
        .theme-text { color: var(--primary); }
        .theme-border { border-color: var(--primary); }
        .theme-btn:hover { background-color: var(--primary-hover); }
        .theme-accent { background-color: var(--bg-accent); }

        /* Courier Badges */
        .badge-myntra { background-color: #d946ef; color: #ffffff; }
        .badge-myntra-shadowfax { background-color: #701a75; color: #ffffff; }
        .badge-flipkart { background-color: #fde047; color: #1e3a8a; }
        .badge-shadowfax { background-color: #374151; color: #ffffff; }
        .badge-valmo { background-color: #ec4899; color: #ffffff; }
        .badge-elasticrun { background-color: #10b981; color: #ffffff; }
        .badge-shiprocket { background-color: #14b8a6; color: #ffffff; }
        .badge-bluedart { background-color: #1d4ed8; color: #ffffff; }
        .badge-ats { background-color: #f59e0b; color: #ffffff; }
        .badge-delhivery { background-color: #ef4444; color: #ffffff; }
        .badge-xpressbees { background-color: #eab308; color: #ffffff; }
        .badge-buffer { background-color: #9ca3af; color: #ffffff; }
    </style>
</head>
<body class="mode-outward min-h-screen flex flex-col transition-colors duration-300">

    <!-- Header -->
    <header class="theme-bg text-white shadow-md transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight flex items-center">
                berryliciousclothing 
                <!-- VERSION 3.0 TAG ADDED HERE -->
                <span class="text-xs font-black bg-yellow-400 text-black px-3 py-1 rounded-full ml-3 tracking-widest shadow-sm">VERSION 3.0</span>
            </h1>
            <div class="flex items-center space-x-3">
                <button onclick="switchView('scanner')" id="nav-scanner-btn" class="bg-white text-gray-800 text-sm font-bold px-4 py-2 rounded-lg shadow-sm transition-all">📦 Scanner</button>
                <button onclick="switchView('reports')" id="nav-reports-btn" class="bg-white/25 hover:bg-white/30 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-all">📊 Reports & Search</button>
                <span id="sync-status" class="text-xs bg-green-500 text-white font-bold px-2.5 py-1 rounded-full">☁️ Connected</span>
                <div class="hidden md:flex space-x-3 text-sm font-medium">
                    <span class="bg-white/20 px-3 py-1 rounded-full">Today Outward: <span id="outward-count">0</span></span>
                    <span class="bg-white/20 px-3 py-1 rounded-full">Today Inward: <span id="inward-count">0</span></span>
                </div>
            </div>
        </div>
    </header>

    <!-- VIEW 1: SCANNER VIEW -->
    <main id="view-scanner" class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Column -->
        <div class="lg:col-span-1 space-y-6">
            <!-- Mode Selector -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="flex w-full">
                    <button id="btn-outward" onclick="setMode('outward')" class="flex-1 py-4 text-center font-bold text-lg border-b-4 border-orange-500 bg-orange-50 text-orange-700 transition-all">
                        📦 OUTWARD
                    </button>
                    <button id="btn-inward" onclick="setMode('inward')" class="flex-1 py-4 text-center font-bold text-lg border-b-4 border-transparent text-gray-500 hover:bg-gray-50 transition-all">
                        📥 INWARD
                    </button>
                </div>
            </div>

            <!-- Session Counter -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex justify-between items-center">
                <div>
                    <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Session Counter</span>
                    <div class="text-2xl font-black text-gray-800" id="session-count">0</div>
                </div>
                <button onclick="resetSessionCount()" class="bg-gray-100 hover:bg-red-50 text-gray-600 hover:text-red-600 text-xs font-bold px-3 py-2 rounded-lg border border-gray-200 transition-colors">
                    🔄 Reset Session
                </button>
            </div>

            <!-- Scanner Input -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 theme-accent transition-colors duration-300">
                <div id="seller-container" class="mb-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Active Marketplace / Seller</label>
                    <select id="seller-select" class="w-full text-lg p-3 border-2 theme-border rounded-lg focus:outline-none focus:ring-4 transition-all shadow-inner bg-white font-medium">
                        <option value="Flipkart">Flipkart</option>
                        <option value="Myntra">Myntra</option>
                        <option value="Meesho">Meesho</option>
                        <option value="Amazon">Amazon</option>
                        <option value="Ajio">Ajio</option>
                        <option value="Nykaa">Nykaa</option>
                        <option value="TataCliq">TataCliq</option>
                        <option value="LimeRoad">LimeRoad</option>
                        <option value="Shopify">Shopify</option>
                        <option value="Wishlink">Wishlink</option>
                    </select>
                </div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Scan or Type AWB Number</label>
                <input type="text" id="awb-input" autocomplete="off" placeholder="Ready to scan..." 
                    oninput="this.value = this.value.replace(/[^a-zA-Z0-9|]/g, '')"
                    class="w-full text-2xl p-4 border-2 theme-border rounded-lg focus:outline-none focus:ring-4 transition-all uppercase font-mono shadow-inner disabled:bg-gray-200 disabled:cursor-not-allowed">
                
                <!-- SCAN MESSAGE AREA -->
                <p id="scan-message" class="mt-3 text-sm font-medium h-auto"></p>
            </div>

            <!-- Stats & Exports -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <h3 class="text-sm font-semibold text-gray-700 mb-4 uppercase tracking-wider">Today's Courier Breakdown</h3>
                <div id="courier-stats" class="space-y-4"></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <button onclick="exportCSV()" class="w-full theme-bg text-white font-bold py-3 px-4 rounded-lg shadow-sm theme-btn transition-colors">Export Active List to CSV</button>
            </div>
        </div>

        <!-- Right Column: Scan History -->
        <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-[800px]">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center theme-accent transition-colors duration-300">
                <h2 class="text-xl font-bold text-gray-800">Scan History: <span id="current-mode-label" class="theme-text">OUTWARD</span></h2>
                <span id="active-list-count" class="bg-gray-800 text-white text-xs font-bold px-3 py-1 rounded-full">0 items</span>
            </div>
            
            <div class="flex-grow overflow-y-auto p-4 bg-gray-50 flex flex-col">
                <ul id="scan-list" class="space-y-3"></ul>
                
                <!-- Show More Container -->
                <div id="show-more-container" class="mt-6 mb-2 text-center hidden">
                    <button onclick="loadMoreItems()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-6 rounded-full shadow-sm transition-colors text-sm">
                        Show More ⬇️
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- VIEW 2: REPORTS -->
    <main id="view-reports" class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full hidden space-y-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">📊 Reports Dashboard</h2>
            <div class="mb-8 bg-gray-50 p-6 rounded-xl border border-gray-200">
                <h3 class="text-lg font-bold text-gray-700 mb-3">🔍 Instant AWB Lookup</h3>
                <input type="text" id="lookup-awb-input" placeholder="Scan AWB..." oninput="handleAWBLookup()" class="w-full p-3 border-2 border-gray-300 rounded-lg uppercase font-mono text-lg bg-white">
                <div id="lookup-result-card" class="mt-4 bg-white p-4 rounded-lg border hidden">
                    <div id="lookup-result-content" class="space-y-1 text-gray-700"></div>
                </div>
            </div>
            <div class="bg-gray-50 p-6 rounded-xl border border-gray-200">
                <h3 class="text-lg font-bold text-gray-700 mb-3">📅 Date Range Reports</h3>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <input type="date" id="filter-start-date" class="w-full p-3 border border-gray-300 rounded-lg">
                    <input type="date" id="filter-end-date" class="w-full p-3 border border-gray-300 rounded-lg">
                </div>
                <div class="flex gap-4">
                    <button onclick="downloadDateRangeReport('outward')" class="bg-orange-600 hover:bg-orange-700 text-white font-bold px-6 py-3 rounded-lg shadow transition-colors">Download Outward (CSV)</button>
                    <button onclick="downloadDateRangeReport('inward')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-lg shadow transition-colors">Download Inward (CSV)</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMCPEiwQX6v7zzUfrYKwdN2mL7OzlGvjc",
            authDomain: "pickups-ea034.firebaseapp.com",
            databaseURL: "https://pickups-ea034-default-rtdb.firebaseio.com",
            projectId: "pickups-ea034",
            storageBucket: "pickups-ea034.firebasestorage.app",
            messagingSenderId: "639515784180",
            appId: "1:639515784180:web:5d75f08744c44f1ef7bfa1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentMode = 'outward'; 
        let firebaseData = { outward: [], inward: [] };
        let currentDisplayLimit = 100;
        
        let pendingFirebaseWrites = new Set();
        
        let sessionCountOutward = parseInt(localStorage.getItem('wh_session_outward') || '0');
        let sessionCountInward = parseInt(localStorage.getItem('wh_session_inward') || '0');

        const awbInput = document.getElementById('awb-input');
        const scanMessage = document.getElementById('scan-message');
        const sellerSelect = document.getElementById('seller-select');
        const syncStatusEl = document.getElementById('sync-status');
        const sessionCountEl = document.getElementById('session-count');

        function getLocalDateKey(dateObj = new Date()) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function cleanUpOldDates(snapshotVal, mode) {
            if (!snapshotVal) return;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - 15);
            const cutoffDateStr = getLocalDateKey(cutoffDate); 
            Object.keys(snapshotVal).forEach(dateKey => {
                if (dateKey < cutoffDateStr) {
                    remove(ref(db, `warehouse/${mode}/${dateKey}`)).catch(e => console.error(e));
                }
            });
        }

        function flattenFirebaseData(snapshotVal) {
            let items = [];
            if (!snapshotVal) return items;
            function extractItems(node) {
                if (!node || typeof node !== 'object') return;
                if (node.awb) { items.push(node); return; }
                Object.values(node).forEach(childNode => extractItems(childNode));
            }
            extractItems(snapshotVal);
            return items;
        }

        function getMergedData(mode) {
            const fbList = firebaseData[mode] || [];
            return fbList.slice().sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        }

        function updateSyncStatusUI() {
            if (pendingFirebaseWrites.size > 0) {
                syncStatusEl.innerText = `⏳ Syncing ${pendingFirebaseWrites.size} items...`;
                syncStatusEl.className = "text-xs bg-amber-500 text-white font-bold px-2.5 py-1 rounded-full animate-pulse";
            } else {
                syncStatusEl.innerText = "☁️ All Synced";
                syncStatusEl.className = "text-xs bg-green-500 text-white font-bold px-2.5 py-1 rounded-full";
            }
            renderList();
        }

        onValue(ref(db, '.info/connected'), (snapshot) => {
            if (snapshot.val() === true) {
                updateSyncStatusUI();
                awbInput.disabled = false;
                awbInput.placeholder = "Ready to scan...";
                awbInput.focus();
                scanMessage.innerText = ""; 
            } else {
                syncStatusEl.innerText = "⛔ Offline (Blocked)";
                syncStatusEl.className = "text-xs bg-red-600 text-white font-bold px-2.5 py-1 rounded-full animate-pulse";
                awbInput.disabled = true; 
                awbInput.placeholder = "NO INTERNET - Scanning Paused";
                awbInput.value = ""; 
                showMessage("❌ No Internet! Scanning is disabled.", "text-white bg-red-600 px-3 py-1 rounded");
                playSound('error'); 
            }
        });

        onValue(ref(db, 'warehouse/outward'), (snapshot) => {
            const val = snapshot.val();
            cleanUpOldDates(val, 'outward');
            firebaseData.outward = flattenFirebaseData(val);
            updateUI();
        });
        
        onValue(ref(db, 'warehouse/inward'), (snapshot) => {
            const val = snapshot.val();
            cleanUpOldDates(val, 'inward');
            firebaseData.inward = flattenFirebaseData(val);
            updateUI();
        });

        function updateUI() {
            renderList();
            renderStats();
            updateGlobalCounts();
        }

        // ====== STRICT COURIER DETECTION ======
        function detectCourier(awb) {
            const cleanAwb = awb.replace(/(NYK|AJI|LI)$/, '');
            const len = cleanAwb.length;

            if (/[A-Z]/.test(cleanAwb)) {
                // Route EMS Speed Post (AM...IN) to ATS
                if (/^[A-Z]{2}\d{9}IN$/.test(cleanAwb)) return { name: 'ATS', class: 'badge-ats' };
                
                // Route Wishlink Ekart (SRSC... or SRSP...)
                if (cleanAwb.startsWith('SRSC') || cleanAwb.startsWith('SRSP')) return { name: 'E-Kart (Wishlink)', class: 'badge-flipkart' };
                
                if (cleanAwb.startsWith('SF') && !cleanAwb.startsWith('MYSF')) return { name: 'Shadowfax', class: 'badge-shadowfax' };
                if (cleanAwb.startsWith('MYSF')) return { name: 'Myntra Shadowfax', class: 'badge-myntra-shadowfax' };
                if (cleanAwb.startsWith('VL')) return { name: 'Valmo', class: 'badge-valmo' };
                if (cleanAwb.startsWith('MH')) return { name: 'ElasticRun', class: 'badge-elasticrun' };
                if (cleanAwb.startsWith('GS')) return { name: 'ShipRocket', class: 'badge-shiprocket' };
                if (cleanAwb.startsWith('MY') && !cleanAwb.startsWith('MYSF')) return { name: 'Myntra Logistics', class: 'badge-myntra' }; 
                if (cleanAwb.startsWith('CLQ')) return { name: 'E-Kart (TataCliq)', class: 'badge-flipkart' };
                if (cleanAwb.startsWith('NK')) return { name: 'E-Kart (Nykaa)', class: 'badge-flipkart' };
                if (cleanAwb.startsWith('LM')) return { name: 'E-Kart (LimeRoad)', class: 'badge-flipkart' }; 
                if (cleanAwb.startsWith('FMP')) return { name: 'Flipkart / E-Kart', class: 'badge-flipkart' }; 
                
            } else if (/^\d+$/.test(cleanAwb)) {
                if (len === 11) return { name: 'BlueDart', class: 'badge-bluedart' };
                if (len === 12) return { name: 'ATS', class: 'badge-ats' }; 
                if ((len === 14 || len === 16) && (cleanAwb.startsWith('16') || cleanAwb.startsWith('37') || cleanAwb.startsWith('133'))) return { name: 'ATS', class: 'badge-ats' };
                if (len >= 13 && len <= 16) {
                    if (cleanAwb.startsWith('134') || cleanAwb.startsWith('136') || cleanAwb.startsWith('141')) return { name: 'Xpressbees', class: 'badge-xpressbees' };
                    return { name: 'Delhivery', class: 'badge-delhivery' };
                }
            }
            return { name: 'Buffer', class: 'badge-buffer' };
        }

        // ====== STRICT MATCHING LOGIC ======
        function verifyMarketplaceMatch(awb, marketplace) {
            const courierObj = detectCourier(awb);
            const courierName = courierObj.name;
            
            if (courierName === 'BlueDart' && ['Meesho', 'Flipkart', 'Myntra', 'Amazon'].includes(marketplace)) return false;
            if (courierName === 'Valmo' && marketplace !== 'Meesho') return false;
            if (courierName === 'Delhivery' && ['Flipkart', 'Myntra', 'Amazon'].includes(marketplace)) return false;
            if (courierName === 'Xpressbees' && ['Flipkart', 'Myntra', 'Amazon'].includes(marketplace)) return false;
            if (courierName === 'Shadowfax' && ['Amazon', 'Flipkart'].includes(marketplace)) return false;
            if (courierName === 'ElasticRun' && marketplace !== 'Meesho') return false;
            if (courierName === 'ATS' && marketplace !== 'Amazon') return false;
            if (courierName === 'Myntra Shadowfax' && marketplace !== 'Myntra') return false;
            if (courierName === 'E-Kart (Wishlink)' && marketplace !== 'Wishlink') return false;

            // Strict Signatures
            const isMyntraSig = awb.startsWith('MY'); // Covers MY and MYSF
            const isFlipkartSig = awb.startsWith('FMP'); // STRICT FMP ONLY
            const isValmoSig = awb.startsWith('VL');
            
            // Support for both SRSC and SRSP for Wishlink Ekart
            const isWishlinkSig = awb.startsWith('SRSC') || awb.startsWith('SRSP');
            
            const isAmazonSig = /^\d{12,16}$/.test(awb) || /^[A-Z]{2}\d{9}IN$/.test(awb);

            // Error Checking Rules
            if (marketplace === 'Flipkart' && !isFlipkartSig) return false;
            if (marketplace === 'Myntra' && !isMyntraSig) return false;
            if (marketplace === 'Meesho' && (isFlipkartSig || isMyntraSig || isWishlinkSig)) return false; // Allows numeric awbs
            if (marketplace === 'Amazon' && !isAmazonSig) return false;
            
            // Wishlink validates if it has the SRSC/SRSP signature OR if it is one of the shared couriers
            if (marketplace === 'Wishlink' && !isWishlinkSig && !['Xpressbees', 'BlueDart', 'Shadowfax', 'Delhivery'].includes(courierName)) return false;
            
            return true;
        }

        awbInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                scanMessage.innerText = '';
                scanMessage.className = "mt-3 text-sm font-medium h-5";

                let awb = this.value.toUpperCase().split('|')[0].replace(/[^A-Z0-9]/g, "").trim();
                if (awb === '') return;
                
                if (awb.startsWith('SWLOMS') || awb.startsWith('MPP') || awb.startsWith('EPTS')) {
                    playSound('error');
                    showMessage(`❌ INVALID BARCODE: Scan AWB, not packaging/order ID (${awb}).`, 'text-red-600 bg-red-100 px-3 py-1 rounded');
                    this.value = ''; this.focus(); return;
                }

                const courierInfo = detectCourier(awb);
                let customMsg = `✅ Success: ${awb}`;
                let colorClass = 'text-green-600 bg-green-100 px-3 py-1 rounded';

                if (currentMode === 'outward') {
                    if (awb.startsWith('AJI') || awb.endsWith('AJI')) sellerSelect.value = 'Ajio';
                    else if (awb.startsWith('LM') || awb.endsWith('LI')) sellerSelect.value = 'LimeRoad';
                    else if (awb.startsWith('NK') || awb.endsWith('NYK')) sellerSelect.value = 'Nykaa';
                    else if (courierInfo.name === 'Myntra Logistics' || courierInfo.name === 'Myntra Shadowfax') sellerSelect.value = 'Myntra';
                    else if (courierInfo.name.includes('TataCliq')) sellerSelect.value = 'TataCliq';
                    else if (courierInfo.name.includes('Nykaa')) sellerSelect.value = 'Nykaa';
                    else if (courierInfo.name === 'E-Kart (Wishlink)' || awb.startsWith('SRSC') || awb.startsWith('SRSP')) sellerSelect.value = 'Wishlink';
                    else if (courierInfo.name.includes('Flipkart')) sellerSelect.value = 'Flipkart';
                    else if (courierInfo.name === 'Valmo' || courierInfo.name === 'ElasticRun') sellerSelect.value = 'Meesho';
                    else if (courierInfo.name === 'ATS') sellerSelect.value = 'Amazon';
                    
                    const finalSeller = sellerSelect.value;

                    // ====== CUSTOM ERROR MESSAGES ======
                    if (!verifyMarketplaceMatch(awb, finalSeller)) {
                        playSound('error');
                        
                        if (finalSeller === 'Flipkart' && !awb.startsWith('FMP')) {
                            showMessage(`❌ INVALID BARCODE: Flipkart parcel must start with 'FMP'.`, 'text-red-600 bg-red-100 px-3 py-1 rounded');
                        } else if (finalSeller === 'Myntra' && !awb.startsWith('MY')) {
                            showMessage(`❌ INVALID BARCODE: Myntra parcel must start with 'MY'.`, 'text-red-600 bg-red-100 px-3 py-1 rounded');
                        } else if (finalSeller === 'Wishlink' && !awb.startsWith('SRSC') && !awb.startsWith('SRSP') && !['Xpressbees', 'BlueDart', 'Shadowfax', 'Delhivery'].includes(courierInfo.name)) {
                            showMessage(`❌ INVALID BARCODE: Wishlink parcel must start with 'SRSC' or 'SRSP', or be a valid Xpressbees, BlueDart, Shadowfax, or Delhivery AWB.`, 'text-red-600 bg-red-100 px-3 py-1 rounded mb-2 inline-block');
                        } else {
                            showMessage(`❌ Mismatch! This AWB format does not match ${finalSeller}.`, 'text-red-600 bg-red-100 px-3 py-1 rounded');
                        }
                        
                        this.value = ''; this.focus(); return;
                    }

                    if (finalSeller === 'Amazon' && courierInfo.name !== 'ATS') {
                        playSound('error');
                        showMessage('❌ Mismatch: Amazon seller can only accept ATS barcodes.', 'text-red-600 bg-red-100 px-3 py-1 rounded');
                        this.value = ''; this.focus(); return;
                    }

                    const outwardMerged = getMergedData('outward');
                    const existingOutward = outwardMerged.find(i => i.awb === awb);
                    if (existingOutward) {
                        showMessage(`❌ FAILED: Duplicate! Already scanned in Outward on ${existingOutward.date} at ${existingOutward.time}`, 'text-red-600 bg-red-100 px-3 py-1 rounded');
                        playSound('duplicate');
                        this.value = ''; this.focus(); return; 
                    }

                    const inwardMerged = getMergedData('inward');
                    const inwardMatch = inwardMerged.find(item => item.awb === awb);
                    
                    if (inwardMatch) {
                        pendingFirebaseWrites.add(`del_in_${awb}`);
                        updateSyncStatusUI();
                        remove(ref(db, `warehouse/inward/${inwardMatch.dateKey}/${inwardMatch.courier}/${inwardMatch.seller}/${inwardMatch.awb}`))
                            .then(() => { pendingFirebaseWrites.delete(`del_in_${awb}`); updateSyncStatusUI(); });
                        
                        customMsg = `🔄 Restored to Outward & Removed from Inward: ${awb}`;
                        colorClass = 'text-blue-700 bg-blue-100 px-3 py-1 rounded';
                    }

                    saveRecordNativeQueue(awb, finalSeller, courierInfo, customMsg, colorClass);

                } else if (currentMode === 'inward') {
                    const outwardMerged = getMergedData('outward');
                    const outwardMatch = outwardMerged.find(item => item.awb === awb);
                    
                    if (!outwardMatch) {
                        playSound('error');
                        showMessage(`❌ ERROR: AWB not found in Outward. Cannot Inward.`, 'text-red-600 bg-red-100 px-3 py-1 rounded');
                        this.value = ''; this.focus(); return;
                    }

                    const inwardMerged = getMergedData('inward');
                    const existingInward = inwardMerged.find(i => i.awb === awb);
                    if (existingInward) {
                        showMessage(`❌ FAILED: Duplicate! Already in Inward on ${existingInward.date} at ${existingInward.time}`, 'text-red-600 bg-red-100 px-3 py-1 rounded');
                        playSound('duplicate');
                        this.value = ''; this.focus(); return; 
                    }

                    const finalSeller = outwardMatch.seller;
                    
                    pendingFirebaseWrites.add(`del_out_${awb}`);
                    updateSyncStatusUI();
                    remove(ref(db, `warehouse/outward/${outwardMatch.dateKey}/${outwardMatch.courier}/${outwardMatch.seller}/${outwardMatch.awb}`))
                        .then(() => { pendingFirebaseWrites.delete(`del_out_${awb}`); updateSyncStatusUI(); });

                    customMsg = `🔄 Recovered & Removed from Outward: ${awb}`;
                    colorClass = 'text-blue-700 bg-blue-100 px-3 py-1 rounded';

                    saveRecordNativeQueue(awb, finalSeller, courierInfo, customMsg, colorClass);
                }
            }
        });

        function saveRecordNativeQueue(awb, finalSeller, courierInfo, customMsg, colorClass) {
            const now = new Date();
            const dateKey = getLocalDateKey(now); 
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            const formattedDate = `${d}-${m}-${y}`;

            const newItem = {
                dateKey: dateKey,
                date: formattedDate,
                time: now.toLocaleTimeString(),
                timestamp: now.getTime(),
                courier: courierInfo.name,
                seller: finalSeller,
                awb: awb,
                badgeClass: courierInfo.class
            };

            if (currentMode === 'outward') {
                sessionCountOutward++;
                localStorage.setItem('wh_session_outward', sessionCountOutward);
                sessionCountEl.innerText = sessionCountOutward;
            } else {
                sessionCountInward++;
                localStorage.setItem('wh_session_inward', sessionCountInward);
                sessionCountEl.innerText = sessionCountInward;
            }
            
            showMessage(customMsg, colorClass);
            playSound('success');

            const inputField = document.getElementById('awb-input');
            inputField.value = '';
            inputField.focus();

            pendingFirebaseWrites.add(awb);
            updateSyncStatusUI(); 

            const path = `warehouse/${currentMode}/${dateKey}/${courierInfo.name}/${finalSeller}/${awb}`;
            
            set(ref(db, path), newItem)
                .then(() => {
                    pendingFirebaseWrites.delete(awb);
                    updateSyncStatusUI();
                })
                .catch(error => {
                    console.error("Firebase sync error for AWB:", awb, error);
                    pendingFirebaseWrites.delete(awb);
                    updateSyncStatusUI();
                });
        }

        window.loadMoreItems = () => {
            currentDisplayLimit += 100;
            renderList();
        };

        function renderList() {
            const listEl = document.getElementById('scan-list');
            const showMoreBtn = document.getElementById('show-more-container');
            const dataToRender = getMergedData(currentMode);
            
            document.getElementById('active-list-count').innerText = `${dataToRender.length} items`;
            listEl.innerHTML = '';

            if (dataToRender.length === 0) {
                listEl.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full py-20 text-gray-400">
                        <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                        <p class="text-lg font-medium">No scans yet.</p>
                        <p class="text-sm">Start scanning AWB barcodes to populate this list.</p>
                    </div>`;
                if(showMoreBtn) showMoreBtn.classList.add('hidden');
                return;
            }

            const itemsToShow = dataToRender.slice(0, currentDisplayLimit);

            itemsToShow.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = "bg-white p-4 rounded-lg shadow-sm border border-gray-200 flex justify-between items-center mb-3";
                
                const isPending = pendingFirebaseWrites.has(item.awb);
                const syncBadge = isPending 
                    ? `<span class="text-[10px] bg-amber-100 text-amber-700 font-bold px-2 py-0.5 rounded-full ml-2 animate-pulse">⏳ Syncing</span>`
                    : `<span class="text-[10px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded-full ml-2">☁ Synced</span>`;

                li.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <span class="text-gray-400 font-mono text-sm w-8">#${dataToRender.length - index}</span>
                        <div class="flex flex-col">
                            <div class="flex items-center">
                                <span class="text-xl font-bold text-gray-800">${item.awb}</span>
                                ${syncBadge}
                            </div>
                            <span class="text-xs text-gray-500">${item.date} ${item.time}</span>
                        </div>
                    </div>
                    <div class="flex items-center">
                        ${item.seller && item.seller !== 'N/A' ? `<span class="bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs font-bold mr-3 border border-gray-200">🛒 ${item.seller}</span>` : ''}
                        <span class="px-3 py-1 rounded-full text-xs font-bold uppercase ${item.badgeClass || 'badge-buffer'}">${item.courier}</span>
                    </div>`;
                listEl.appendChild(li);
            });

            if (dataToRender.length > currentDisplayLimit) {
                if (showMoreBtn) showMoreBtn.classList.remove('hidden');
            } else {
                if (showMoreBtn) showMoreBtn.classList.add('hidden');
            }
        }

        function renderStats() {
            const statsEl = document.getElementById('courier-stats');
            const todayKey = getLocalDateKey();
            const todaysItems = getMergedData(currentMode).filter(i => i.dateKey === todayKey);

            if (todaysItems.length === 0) {
                statsEl.innerHTML = `<p class="text-gray-400 text-sm italic">No scans today.</p>`;
                return;
            }

            let counts = {
                'Flipkart / E-Kart': { count: 0, badge: 'badge-flipkart' },
                'E-Kart (Wishlink)': { count: 0, badge: 'badge-flipkart' },
                'Myntra Logistics': { count: 0, badge: 'badge-myntra' },
                'Myntra Shadowfax': { count: 0, badge: 'badge-myntra-shadowfax' },
                'Delhivery': { count: 0, badge: 'badge-delhivery' },
                'Xpressbees': { count: 0, badge: 'badge-xpressbees' },
                'Shadowfax': { count: 0, badge: 'badge-shadowfax' },
                'BlueDart': { count: 0, badge: 'badge-bluedart' },
                'ATS': { count: 0, badge: 'badge-ats' },
                'Buffer': { count: 0, badge: 'badge-buffer' } 
            };

            let bufferAWBs = []; 

            todaysItems.forEach(i => {
                if(!counts[i.courier]) counts[i.courier] = { count: 0, badge: i.badgeClass };
                counts[i.courier].count++;
                if (i.courier === 'Buffer') { bufferAWBs.push(i.awb); }
            });

            statsEl.innerHTML = '';
            
            for (const [courier, info] of Object.entries(counts)) {
                if (info.count === 0 && !['Flipkart / E-Kart', 'E-Kart (Wishlink)', 'Myntra Logistics', 'Myntra Shadowfax', 'Delhivery', 'Xpressbees', 'Shadowfax', 'BlueDart', 'ATS'].includes(courier)) {
                    continue; 
                }
                statsEl.innerHTML += `
                    <div class="flex justify-between border-b border-gray-100 pb-2 text-sm py-1">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full ${info.badge}"></span>
                            <span class="font-medium text-gray-700">${courier}</span>
                        </div>
                        <span class="font-bold bg-gray-100 px-2 py-0.5 rounded text-gray-900">${info.count}</span>
                    </div>`;
            }

            if (bufferAWBs.length > 0) {
                const bufferListHTML = bufferAWBs.map(awb => `<li class="py-1 border-b border-red-100/50 last:border-0">• ${awb}</li>`).join('');
                statsEl.innerHTML += `
                    <div class="mt-6 bg-red-50 border border-red-200 rounded-lg p-4 shadow-inner">
                        <div class="flex items-center space-x-2 mb-2">
                            <span class="text-red-500 text-lg">⚠️</span>
                            <h4 class="text-xs font-bold text-red-800 uppercase tracking-wider">Buffer Exceptions (${bufferAWBs.length})</h4>
                        </div>
                        <p class="text-[10px] text-red-600 mb-2 leading-tight">These AWBs did not match known courier formats:</p>
                        <ul class="text-xs font-mono text-red-700 max-h-32 overflow-y-auto bg-white p-2 rounded border border-red-100">
                            ${bufferListHTML}
                        </ul>
                    </div>
                `;
            }
        }

        function updateGlobalCounts() {
            const todayKey = getLocalDateKey();
            document.getElementById('outward-count').innerText = getMergedData('outward').filter(i => i.dateKey === todayKey).length;
            document.getElementById('inward-count').innerText = getMergedData('inward').filter(i => i.dateKey === todayKey).length;
        }

        function showMessage(msg, colorClass) {
            scanMessage.innerText = msg;
            scanMessage.className = `mt-3 text-sm font-bold h-auto ${colorClass} inline-block`;
        }

        let globalAudioCtx = null; 
        function playSound(type) {
            if (!globalAudioCtx) globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (globalAudioCtx.state === 'suspended') globalAudioCtx.resume();

            const osc = globalAudioCtx.createOscillator();
            const gain = globalAudioCtx.createGain();
            osc.connect(gain); gain.connect(globalAudioCtx.destination);

            if (type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, globalAudioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, globalAudioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, globalAudioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, globalAudioCtx.currentTime + 0.1);
                osc.start(globalAudioCtx.currentTime); osc.stop(globalAudioCtx.currentTime + 0.2);
            } else if (type === 'duplicate') {
                osc.type = 'square'; osc.frequency.setValueAtTime(350, globalAudioCtx.currentTime); osc.frequency.setValueAtTime(250, globalAudioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.5, globalAudioCtx.currentTime); gain.gain.setValueAtTime(0.01, globalAudioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.5, globalAudioCtx.currentTime + 0.15); gain.gain.exponentialRampToValueAtTime(0.01, globalAudioCtx.currentTime + 0.35);
                osc.start(globalAudioCtx.currentTime); osc.stop(globalAudioCtx.currentTime + 0.35);
            } else {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(260, globalAudioCtx.currentTime); osc.frequency.setValueAtTime(140, globalAudioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.6, globalAudioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, globalAudioCtx.currentTime + 0.3);
                osc.start(globalAudioCtx.currentTime); osc.stop(globalAudioCtx.currentTime + 0.3);
            }
        }

        window.setMode = (mode) => {
            currentMode = mode; currentDisplayLimit = 100; 
            document.body.className = `mode-${mode} min-h-screen flex flex-col transition-colors`;
            document.getElementById('btn-outward').className = mode === 'outward' ? "flex-1 py-4 text-center font-bold text-lg border-b-4 border-orange-500 bg-orange-50 text-orange-700" : "flex-1 py-4 text-center font-bold text-lg border-b-4 border-transparent text-gray-500 hover:bg-gray-50";
            document.getElementById('btn-inward').className = mode === 'inward' ? "flex-1 py-4 text-center font-bold text-lg border-b-4 border-blue-500 bg-blue-50 text-blue-700" : "flex-1 py-4 text-center font-bold text-lg border-b-4 border-transparent text-gray-500 hover:bg-gray-50";
            document.getElementById('current-mode-label').innerText = mode.toUpperCase();
            document.getElementById('seller-container').style.display = mode === 'outward' ? 'block' : 'none';
            sessionCountEl.innerText = mode === 'outward' ? sessionCountOutward : sessionCountInward;
            updateUI(); awbInput.focus();
        };

        window.switchView = (v) => {
            document.getElementById('view-scanner').classList.toggle('hidden', v !== 'scanner'); document.getElementById('view-reports').classList.toggle('hidden', v !== 'reports');
            if (v === 'scanner') {
                document.getElementById('nav-scanner-btn').className = "bg-white text-gray-800 text-sm font-bold px-4 py-2 rounded-lg shadow-sm transition-all";
                document.getElementById('nav-reports-btn').className = "bg-white/25 hover:bg-white/30 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-all"; awbInput.focus();
            } else {
                document.getElementById('nav-reports-btn').className = "bg-white text-gray-800 text-sm font-bold px-4 py-2 rounded-lg shadow-sm transition-all";
                document.getElementById('nav-scanner-btn').className = "bg-white/25 hover:bg-white/30 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-all";
            }
        };

        window.resetSessionCount = () => { 
            if(confirm(`Are you sure you want to reset the ${currentMode.toUpperCase()} session count to 0?`)) { 
                if (currentMode === 'outward') { sessionCountOutward = 0; localStorage.setItem('wh_session_outward', 0); } 
                else { sessionCountInward = 0; localStorage.setItem('wh_session_inward', 0); }
                sessionCountEl.innerText = 0; 
            }
        };

        window.handleAWBLookup = () => {
            const query = document.getElementById('lookup-awb-input').value.trim().toUpperCase();
            const card = document.getElementById('lookup-result-card'); const content = document.getElementById('lookup-result-content');
            if (!query) { card.classList.add('hidden'); return; }
            let foundIn = null, record = null;
            let matchOut = getMergedData('outward').find(item => item.awb === query);
            
            if (matchOut) { foundIn = "OUTWARD (Handover)"; record = matchOut; } 
            else {
                let matchIn = getMergedData('inward').find(item => item.awb === query);
                if (matchIn) { foundIn = "INWARD (Returns)"; record = matchIn; }
            }

            card.classList.remove('hidden');
            if (record) {
                content.innerHTML = `<p><strong>Status:</strong> <span class="text-green-600 font-bold">Found in ${foundIn}</span></p><p><strong>AWB Number:</strong> <span class="font-mono font-bold">${record.awb}</span></p><p><strong>Channel/Seller:</strong> ${record.seller}</p><p><strong>Courier:</strong> ${record.courier}</p><p><strong>Date & Time:</strong> ${record.date} at ${record.time}</p>`;
            } else {
                content.innerHTML = `<p class="text-red-500 font-semibold">❌ AWB "${query}" not found in database.</p>`;
            }
        };

        window.exportCSV = () => window.downloadDateRangeReport(currentMode);
        
        window.downloadDateRangeReport = (mode) => {
            const sDate = document.getElementById('filter-start-date').value; 
            const eDate = document.getElementById('filter-end-date').value;
            let filtered = getMergedData(mode);
            if (sDate && eDate) {
                const start = new Date(sDate); const end = new Date(eDate); end.setHours(23, 59, 59);
                filtered = filtered.filter(i => { let idt = new Date(i.dateKey); return idt >= start && idt <= end; });
            }
            if (filtered.length === 0) { alert('No records found for the selected date range.'); return; }

            let csv = "Serial Number,Date,Channel,Courier,AWB,Time\n";
            filtered.forEach((i, idx) => {
                csv += `${filtered.length - idx},${i.date},${i.seller || 'N/A'},${i.courier},'${i.awb},${i.time}\n`;
                if (mode === 'inward' && (idx + 1) % 20 === 0 && (idx + 1) !== filtered.length) csv += ",,,,,\n"; 
            });
            const link = document.createElement("a"); 
            link.setAttribute("href", encodeURI("data:text/csv;charset=utf-8," + csv)); 
            link.setAttribute("download", `warehouse_report_${mode}_${getLocalDateKey()}.csv`); 
            document.body.appendChild(link); 
            link.click(); 
            document.body.removeChild(link);
        };

        window.onload = () => { 
            window.setMode('outward'); 
            const endDateInput = document.getElementById('filter-end-date'); const startDateInput = document.getElementById('filter-start-date');
            const today = new Date(); const fifteenDaysAgo = new Date(); fifteenDaysAgo.setDate(today.getDate() - 15);
            endDateInput.value = getLocalDateKey(today); startDateInput.value = getLocalDateKey(fifteenDaysAgo);
        };
    </script>
</body>
</html>
