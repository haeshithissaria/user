<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berrylicious - SKU Search Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex items-center justify-center">

  <div class="max-w-3xl w-full bg-white p-6 rounded-2xl shadow-lg border border-gray-200 space-y-6">
    
    <div class="text-center">
      <h2 class="text-2xl font-bold text-gray-900 flex items-center justify-center gap-2">
        <i data-lucide="sparkles" class="w-6 h-6 text-pink-600"></i> Berrylicious Search Portal
      </h2>
      <p class="text-sm text-gray-500 mt-1">Enter SKU to view product media directly on the page</p>
    </div>

    <!-- INLINE EMBEDDED MEDIA VIEWER -->
    <div id="inline-viewer-container" class="hidden space-y-3 border border-pink-200 bg-pink-50/40 rounded-2xl p-4 shadow-sm">
      <div class="flex justify-between items-center border-b border-pink-100 pb-2">
        <div class="flex items-center gap-2">
          <i data-lucide="image" class="w-5 h-5 text-pink-600"></i>
          <span id="viewer-sku-title" class="font-bold text-gray-900 text-sm">Viewing SKU: </span>
        </div>
        <button onclick="closeViewer()" class="text-gray-500 hover:text-red-600 bg-white border border-gray-200 hover:bg-gray-100 px-3 py-1 rounded-lg text-xs font-medium transition cursor-pointer flex items-center gap-1">
          <i data-lucide="x" class="w-3.5 h-3.5"></i> Close View
        </button>
      </div>
      
      <div class="w-full h-[65vh] bg-slate-900 rounded-xl shadow-sm border border-gray-200 relative overflow-hidden flex items-center justify-center p-4">
        <div id="inline-loader" class="absolute inset-0 flex items-center justify-center bg-white z-10 text-gray-500 font-medium text-sm">
          Loading media...
        </div>
        <div id="media-output-wrapper" class="w-full h-full flex items-center justify-center"></div>
      </div>
    </div>

    <!-- SEARCH FORM -->
    <form onsubmit="handleUserSearch(event)" class="flex gap-2">
      <div class="relative flex-grow">
        <input type="text" id="user-search-input" placeholder="e.g. K1640J" required
          class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500 text-lg uppercase font-semibold">
        <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3 top-4"></i>
      </div>
      <button type="submit" id="search-btn" class="bg-pink-600 hover:bg-pink-700 text-white font-medium px-6 py-3 rounded-xl flex items-center justify-center gap-2 transition cursor-pointer">
        Find SKU
      </button>
    </form>

    <div id="search-feedback" class="hidden rounded-xl p-4 text-center font-medium"></div>

    <!-- MULTI-MATCH TABLE CONTAINER -->
    <div id="multi-result-container" class="hidden border border-gray-200 rounded-xl overflow-hidden shadow-sm">
      <div class="bg-amber-50 border-b border-amber-200 p-3 text-amber-800 text-xs font-semibold flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4"></i> Multiple SKUs found:
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 border-b text-gray-600 uppercase text-xs">
            <tr>
              <th class="py-3 px-4">#</th>
              <th class="py-3 px-4">SKU Code</th>
              <th class="py-3 px-4 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="multi-result-body" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCvVLVvphi5VLk30MMiOyvX_HuDG7HdHU",
      authDomain: "sku-finder-756b7.firebaseapp.com",
      databaseURL: "https://sku-finder-756b7-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sku-finder-756b7",
      storageBucket: "sku-finder-756b7.firebasestorage.app",
      messagingSenderId: "533564999771",
      appId: "1:533564999771:web:f9a22330ea6a139d40d77e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const productsRef = ref(db, 'products');

    let products = [];

    onValue(productsRef, (snapshot) => {
      const data = snapshot.val();
      products = data ? Object.keys(data).map(id => ({ id, ...data[id] })) : [];
    });

    // Button Freeze & Spinner Toggle Handler
    function setButtonLoading(isLoading) {
      const btn = document.getElementById('search-btn');
      if (isLoading) {
        btn.disabled = true;
        btn.classList.add('opacity-75', 'cursor-not-allowed');
        btn.classList.remove('hover:bg-pink-700', 'cursor-pointer');
        btn.innerHTML = `
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Loading...
        `;
      } else {
        btn.disabled = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        btn.classList.add('hover:bg-pink-700', 'cursor-pointer');
        btn.innerHTML = `Find SKU`;
      }
    }

    window.showViewer = function(sku, link) {
      setButtonLoading(true); 
      document.getElementById('viewer-sku-title').innerText = `Viewing SKU: ${sku}`;
      const loader = document.getElementById('inline-loader');
      const wrapper = document.getElementById('media-output-wrapper');
      
      loader.classList.remove('hidden');
      wrapper.innerHTML = '';

      document.getElementById('inline-viewer-container').classList.remove('hidden');
      document.getElementById('inline-viewer-container').scrollIntoView({ behavior: 'smooth' });

      const isImage = /\.(jpeg|jpg|png|webp|gif|avif)(#|\?|$)/i.test(link) || link.includes('firebasestorage.googleapis.com') || link.includes('cloudinary') || link.includes('imgur');

      if (isImage) {
        const img = document.createElement('img');
        img.src = link;
        img.className = "max-w-full max-h-full object-contain rounded-lg shadow-md";
        img.onload = function() {
          loader.classList.add('hidden');
          setButtonLoading(false); 
        };
        img.onerror = function() {
          loader.classList.add('hidden');
          setButtonLoading(false); 
          wrapper.innerHTML = `<p class="text-red-400 text-sm font-medium">Failed to load image preview. <a href="${link}" target="_blank" class="underline text-pink-400">Open directly</a></p>`;
        };
        wrapper.appendChild(img);
      } else {
        const iframe = document.createElement('iframe');
        iframe.src = link;
        iframe.className = "w-full h-full border-0 bg-white rounded-lg";
        iframe.onload = function() {
          loader.classList.add('hidden');
          setButtonLoading(false); 
        };
        wrapper.appendChild(iframe);
      }
    };

    window.closeViewer = function() {
      document.getElementById('inline-viewer-container').classList.add('hidden');
      document.getElementById('media-output-wrapper').innerHTML = '';
      setButtonLoading(false); 
    };

    window.handleUserSearch = function(e) {
      e.preventDefault();
      const query = document.getElementById('user-search-input').value.trim().toUpperCase();
      const feedback = document.getElementById('search-feedback');
      const multiContainer = document.getElementById('multi-result-container');
      const multiBody = document.getElementById('multi-result-body');

      feedback.classList.add('hidden');
      multiContainer.classList.add('hidden');
      multiBody.innerHTML = '';
      closeViewer();

      if (!query) return;

      const exactMatch = products.find(p => p.sku.toUpperCase() === query);

      if (exactMatch) {
        showViewer(exactMatch.sku, exactMatch.link);
        return;
      }

      const matches = products
        .filter(p => p.sku.toUpperCase().includes(query))
        .sort((a, b) => a.sku.localeCompare(b.sku, undefined, { numeric: true }));

      if (matches.length === 0) {
        feedback.className = "block bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-center font-medium";
        feedback.innerHTML = `Wrong input or SKU not found! Try again.`;
      } else {
        multiContainer.classList.remove('hidden');
        matches.forEach((prod, index) => {
          const row = document.createElement('tr');
          row.className = "hover:bg-gray-50 transition";
          row.innerHTML = `
            <td class="py-3 px-4 font-mono text-gray-500">${index + 1}</td>
            <td class="py-3 px-4 font-bold text-gray-900">${escapeHtml(prod.sku)}</td>
            <td class="py-3 px-4 text-right">
              <button onclick="showViewer('${escapeHtml(prod.sku)}', '${escapeHtml(prod.link)}')" class="bg-pink-600 hover:bg-pink-700 text-white font-medium px-3 py-1.5 rounded-lg text-xs inline-flex items-center gap-1 transition cursor-pointer">
                View Link <i data-lucide="eye" class="w-3.5 h-3.5"></i>
              </button>
            </td>
          `;
          multiBody.appendChild(row);
        });
        lucide.createIcons();
      }
    };

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match]));
    }

    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
  </script>
  <script>
    // Disable right-click menu
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // Block common DevTools shortcuts
    document.addEventListener('keydown', (e) => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U')
      ) {
        e.preventDefault();
      }
    });

    // DevTools Pause / Freeze Loop (Anti-Debugging)
    (function () {
      function blockDevTools() {
        const startTime = performance.now();
        
        (function () {
          return false;
        })
        ["constructor"]("debugger")();

        const endTime = performance.now();

        if (endTime - startTime > 100) {
          document.body.innerHTML = `
            <div style="height:100vh; display:flex; justify-content:center; align-items:center; background:#1e293b; color:#fff; font-family:sans-serif; text-align:center; padding:20px;">
              <div>
                <h1 style="font-size:2rem; font-weight:bold; color:#ef4444; margin-bottom:10px;">DevTools Detected</h1>
                <p style="color:#94a3b8;">Access is restricted. Please close Developer Tools to resume.</p>
              </div>
            </div>
          `;
        }
      }

      setInterval(blockDevTools, 100);
    })();
  </script>
</body>
</html>
